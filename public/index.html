<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAYL</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <p id="boot" class="boot" data-i18n="common.loading"></p>

  <!-- الدخول والتأسيس الأول -->
  <section id="view-auth" class="auth" hidden>
    <div class="auth-card">
      <div class="logo-plate">
        <img src="/assets/logo/tayl-logo-official.jfif" width="1408" height="768" alt="TAYL — Strategic Accounting | Finance | Cost Solutions">
      </div>
      <div id="auth-body" class="auth-body"></div>
      <div class="auth-foot">
        <span><span data-i18n="support.label"></span> <a class="phone" dir="ltr" href="tel:01123401333">01123401333</a></span>
        <button id="auth-lang" class="btn small" type="button"></button>
      </div>
    </div>
  </section>

  <!-- البرنامج بعد الدخول -->
  <div id="view-app" class="shell" hidden>
    <aside id="side" class="side" aria-label="navigation">
      <div class="logo-plate">
        <img src="/assets/logo/tayl-logo-official.jfif" width="1408" height="768" alt="TAYL — Strategic Accounting | Finance | Cost Solutions">
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="support">
        <span data-i18n="support.label"></span>
        <a id="support-phone" class="phone" dir="ltr" href="tel:01123401333">01123401333</a>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div class="hello">
          <h1 id="greeting"></h1>
          <p id="date" class="muted"></p>
        </div>
        <div class="tools">
          <label class="branch-pick"><span data-i18n="session.branch"></span> <select id="branch-select"></select></label>
          <span class="who"><span id="server-state" class="dot" role="img"></span> <span id="user-name"></span></span>
          <span id="session-state" class="chip"></span>
          <time id="clock" class="clock" dir="ltr"></time>
          <button id="lang-toggle" class="btn small" type="button"></button>
          <button id="logout" class="btn small" type="button"></button>
        </div>
      </header>
      <div id="banner" class="banner" role="status" hidden></div>
      <section id="page" class="page" tabindex="-1"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog" class="dialog"></dialog>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views/auth.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/company.js"></script>
  <script src="/js/views/branches.js"></script>
  <script src="/js/views/users.js"></script>
  <script src="/js/views/roles.js"></script>
  <script src="/js/views/settings.js"></script>
  <script src="/js/views/audit.js"></script>
  <script src="/js/views/account.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
